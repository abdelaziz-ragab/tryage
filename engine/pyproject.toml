[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tryage-engine"
version = "0.0.1"
description = "Combinatorial group testing design + decode engine for Tryage"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools]
py-modules = ["design", "decode", "simulate", "harness", "calibration", "adaptive", "benchmark", "replay", "replay_rust", "competitors", "competitor_report"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
